<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Loose Screws</title>
  <desc id="d">The Loose Screws wordmark in steel and ember over a starfield with drifting screws: a 6DOF browser shooter in procedurally generated, destructible worlds.</desc>
  <style>
    .drift { animation: drift 11s ease-in-out infinite alternate; }
    .drift.b { animation-duration: 14s; animation-delay: -5s; }
    .drift.c { animation-duration: 9s; animation-delay: -2s; animation-direction: alternate-reverse; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
    .spin.r { animation-direction: reverse; animation-duration: 34s; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle.b { animation-delay: -1.1s; animation-duration: 4.1s; }
    .twinkle.c { animation-delay: -2.3s; animation-duration: 2.7s; }
    .glint { animation: glint 7s ease-in-out 1s infinite; }
    .loose { transform-box: fill-box; transform-origin: center; transform: rotate(-16deg); animation: loose 7s ease-in-out 1.5s infinite; }
    .bolt { transform: translateX(-400px); animation: bolt 6.5s linear infinite; }
    .bolt.b { animation-delay: 3.4s; animation-duration: 8s; }
    .glow { animation: glow 6s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(-14px, 8px); } to { transform: translate(16px, -10px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes glint { 0% { transform: translateX(-260px); } 28%, 100% { transform: translateX(1220px); } }
    @keyframes loose {
      0%, 70%, 100% { transform: rotate(-16deg); }
      76% { transform: rotate(-38deg) translateY(-2px); }
      82% { transform: rotate(-8deg); }
      88% { transform: rotate(-22deg); }
      94% { transform: rotate(-14deg); }
    }
    @keyframes bolt { 0% { transform: translateX(-400px); } 22%, 100% { transform: translateX(1700px); } }
    @keyframes glow { from { opacity: 0.55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .drift, .spin, .twinkle, .glint, .loose, .bolt, .glow { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="62%" cy="40%" r="85%">
      <stop offset="0" stop-color="#182030"/>
      <stop offset="0.55" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <radialGradient id="ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8c3c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8c3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="energy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58c7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58c7ff" stop-opacity="0"/>
    </radialGradient>
    <!-- The wordmark's chrome (the start screen's steel and ember gradients), over the letter height. -->
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.36" stop-color="#e3e7ee"/>
      <stop offset="0.52" stop-color="#8d96a6"/>
      <stop offset="0.68" stop-color="#c3c9d4"/>
      <stop offset="1" stop-color="#f2f4f8"/>
    </linearGradient>
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#ffe0ad"/>
      <stop offset="0.44" stop-color="#ffb347"/>
      <stop offset="0.54" stop-color="#d5541b"/>
      <stop offset="0.76" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffd28a"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt-energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c7ff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#58c7ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="bolt-boost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4cc"/>
    </linearGradient>
    <radialGradient id="screw-face" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="0.45" stop-color="#aeb6c3"/>
      <stop offset="1" stop-color="#4c5361"/>
    </radialGradient>
    <linearGradient id="screw-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#e2541c"/>
    </linearGradient>
    <radialGradient id="screw-dim" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#8f98a8"/>
      <stop offset="1" stop-color="#2b303b"/>
    </radialGradient>
    <!-- The start screen's screw head (64 x 64). -->
    <symbol id="screw" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="url(#screw-rim)"/>
      <circle cx="32" cy="32" r="24" fill="url(#screw-face)"/>
      <path d="M28 14h8v14h14v8H36v14h-8V36H14v-8h14z" fill="#262b35"/>
      <path d="M29.5 15.5h5v14h14v5" fill="none" stroke="#7d8696" stroke-width="1.2" opacity="0.6"/>
    </symbol>
    <!-- A loose screw drifting in space: slotted head and a short thread. -->
    <symbol id="drifter" viewBox="0 0 40 64">
      <path d="M14 22h12v30l-6 10-6-10z" fill="#5d6574"/>
      <path d="M14 27l12-3M14 33l12-3M14 39l12-3M14 45l12-3" stroke="#a7afbd" stroke-width="1.6"/>
      <ellipse cx="20" cy="16" rx="18" ry="9" fill="url(#screw-dim)"/>
      <ellipse cx="20" cy="13.5" rx="18" ry="9" fill="#c9d0db"/>
      <path d="M8 13.5h24" stroke="#2b303b" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- Letters on a 100-unit grid (cap height 100), chamfered like stamped plate. -->
    <path id="gL" d="M0 0H18V82H60V100H0Z"/>
    <path id="gO" d="M12 0H48L60 12V88L48 100H12L0 88V12ZM18 18V82H42V18Z"/>
    <path id="gS" d="M12 0H60V18H18V41H48L60 53V88L48 100H0V82H42V59H12L0 47V12Z"/>
    <path id="gE" d="M0 0H60V18H18V41H50V59H18V82H60V100H0Z"/>
    <path id="gC" d="M12 0H48L60 12V30H42V18H18V82H42V70H60V88L48 100H12L0 88V12Z"/>
    <path id="gR" d="M0 0H48L60 12V46L51 55L62 100H43L34 60H18V100H0ZM18 18V42H42V18Z"/>
    <path id="gW" d="M0 0H17L21 70L31 20H45L55 70L59 0H76L68 100H50L38 48L26 100H8Z"/>
    <g id="loose-word">
      <use href="#gL" xlink:href="#gL"/>
      <use href="#gO" xlink:href="#gO" x="68"/>
      <use href="#gO" xlink:href="#gO" x="136"/>
      <use href="#gS" xlink:href="#gS" x="204"/>
      <use href="#gE" xlink:href="#gE" x="272"/>
    </g>
    <g id="screws-word">
      <use href="#gS" xlink:href="#gS"/>
      <use href="#gC" xlink:href="#gC" x="68"/>
      <use href="#gR" xlink:href="#gR" x="136"/>
      <use href="#gE" xlink:href="#gE" x="206"/>
      <use href="#gW" xlink:href="#gW" x="274"/>
      <use href="#gS" xlink:href="#gS" x="358"/>
    </g>
    <mask id="word-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="400">
      <g transform="translate(272 92) scale(1.2) skewX(-12)" fill="#fff">
        <use href="#loose-word" xlink:href="#loose-word"/>
        <use href="#screws-word" xlink:href="#screws-word" x="368"/>
      </g>
    </mask>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <ellipse class="glow" cx="760" cy="160" rx="520" ry="150" fill="url(#ember-glow)"/>
    <ellipse cx="1120" cy="300" rx="260" ry="120" fill="url(#energy-glow)"/>

    <!-- Stars -->
    <g fill="#dfe6f2">
      <g class="twinkle">
        <circle cx="38" cy="30" r="1.2"/><circle cx="214" cy="268" r="1"/><circle cx="356" cy="22" r="1.4"/>
        <circle cx="520" cy="372" r="1.1"/><circle cx="702" cy="36" r="1"/><circle cx="866" cy="356" r="1.3"/>
        <circle cx="1012" cy="24" r="1.1"/><circle cx="1188" cy="232" r="1.2"/><circle cx="1254" cy="118" r="1"/>
      </g>
      <g class="twinkle b">
        <circle cx="120" cy="218" r="1"/><circle cx="286" cy="352" r="1.2"/><circle cx="452" cy="58" r="0.9"/>
        <circle cx="612" cy="312" r="1.2"/><circle cx="794" cy="384" r="0.9"/><circle cx="940" cy="62" r="1.3"/>
        <circle cx="1090" cy="380" r="1"/><circle cx="1236" cy="350" r="1.3"/><circle cx="20" cy="372" r="1"/>
      </g>
      <g class="twinkle c">
        <circle cx="176" cy="58" r="0.9"/><circle cx="404" cy="300" r="1"/><circle cx="584" cy="16" r="1.1"/>
        <circle cx="742" cy="268" r="0.8"/><circle cx="986" cy="300" r="0.9"/><circle cx="1140" cy="148" r="1"/>
        <circle cx="1266" cy="18" r="1.2"/><circle cx="64" cy="140" r="0.8"/><circle cx="660" cy="350" r="1"/>
      </g>
      <g opacity="0.45">
        <circle cx="90" cy="96" r="0.7"/><circle cx="246" cy="128" r="0.6"/><circle cx="330" cy="246" r="0.7"/>
        <circle cx="488" cy="246" r="0.6"/><circle cx="560" cy="80" r="0.7"/><circle cx="824" cy="20" r="0.6"/>
        <circle cx="904" cy="262" r="0.7"/><circle cx="1050" cy="226" r="0.6"/><circle cx="1206" cy="72" r="0.7"/>
        <circle cx="1170" cy="300" r="0.6"/><circle cx="150" cy="300" r="0.6"/><circle cx="694" cy="226" r="0.6"/>
      </g>
    </g>

    <!-- Drifting screws -->
    <g class="drift"><g transform="translate(1170 40)"><g class="spin"><use href="#drifter" xlink:href="#drifter" width="34" height="54"/></g></g></g>
    <g class="drift b"><g transform="translate(70 300)"><g class="spin r"><use href="#drifter" xlink:href="#drifter" width="26" height="42"/></g></g></g>
    <g class="drift c"><g transform="translate(1080 316)"><g class="spin"><use href="#drifter" xlink:href="#drifter" width="20" height="32"/></g></g></g>
    <g class="drift c"><g transform="translate(470 330)"><g class="spin r"><use href="#drifter" xlink:href="#drifter" width="16" height="26"/></g></g></g>
    <g class="drift b" opacity="0.7"><g transform="translate(880 22)"><g class="spin"><use href="#drifter" xlink:href="#drifter" width="14" height="22"/></g></g></g>
    <g class="drift" opacity="0.6"><g transform="translate(330 40)"><g class="spin r"><use href="#drifter" xlink:href="#drifter" width="12" height="19"/></g></g></g>

    <!-- Shots crossing the field -->
    <g class="bolt"><rect x="0" y="342" width="150" height="3" rx="1.5" fill="url(#bolt-energy)"/><circle cx="150" cy="343.5" r="4" fill="#bfeaff" opacity="0.8"/></g>
    <g class="bolt b"><rect x="0" y="66" width="190" height="2.4" rx="1.2" fill="url(#bolt-boost)"/></g>

    <!-- The logo screw, backing out a little now and then -->
    <g transform="translate(70 100)">
      <g class="loose"><use href="#screw" xlink:href="#screw" width="140" height="140"/></g>
    </g>

    <!-- Wordmark: shadow, chrome, glint -->
    <g transform="translate(272 98) scale(1.2) skewX(-12)" fill="#000" opacity="0.55">
      <use href="#loose-word" xlink:href="#loose-word"/>
      <use href="#screws-word" xlink:href="#screws-word" x="368"/>
    </g>
    <g transform="translate(272 92) scale(1.2) skewX(-12)">
      <use href="#loose-word" xlink:href="#loose-word" fill="url(#steel)"/>
      <use href="#screws-word" xlink:href="#screws-word" x="368" fill="url(#ember)"/>
    </g>
    <g mask="url(#word-mask)">
      <g class="glint"><rect x="0" y="80" width="110" height="150" fill="url(#band)" transform="skewX(-20)"/></g>
    </g>

    <!-- Tagline -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
      <rect x="200" y="283" width="40" height="3" rx="1.5" fill="#ffb347"/>
      <rect x="1040" y="283" width="40" height="3" rx="1.5" fill="#ffb347"/>
      <text x="640" y="292" font-size="21" font-weight="700" fill="#e6e8ee" textLength="760" lengthAdjust="spacingAndGlyphs">6DOF SCRAP-SHIP BRAWLS IN WORLDS YOU CAN BLOW APART</text>
      <text x="640" y="334" font-size="15" font-weight="600" fill="#9aa1b2" textLength="560" lengthAdjust="spacingAndGlyphs">RUST CORE · WEBASSEMBLY · WEBGPU · RUNS IN THE BROWSER</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
