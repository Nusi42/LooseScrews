[package]
name = "ls-sim"
description = "Deterministic game simulation: ships, weapons, projectiles, rule sets, Paint the Void"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ls-math.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true

# Lets the unit tests (including the replay golden hash) run on wasm32 under Node:
#   CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner
#   cargo test -p ls-sim --target wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
