[workspace]
resolver = "2"
members = [
    "crates/ls-math",
    "crates/ls-worldgen",
    "crates/ls-sim",
    "crates/ls-net",
    "crates/ls-game",
    "crates/ls-server",
    "crates/ls-wasm",
    "crates/ls-bots",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
ls-math = { path = "crates/ls-math" }
ls-worldgen = { path = "crates/ls-worldgen" }
ls-sim = { path = "crates/ls-sim" }
ls-net = { path = "crates/ls-net" }
ls-game = { path = "crates/ls-game", default-features = false }

# Serialization and data
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Deterministic math
libm = "0.2.16"

# Hashing (golden hashes)
sha2 = "0.11.0"

# Server / async
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# WebTransport (HTTP/3 over QUIC); ring keeps the build free of cmake/NASM.
wtransport = { version = "0.7.2", default-features = false, features = ["self-signed", "ring"] }

# WASM (wasm-bindgen must match the installed CLI exactly)
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
wasm-bindgen-test = "=0.3.76"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No fast-math: Rust never enables it by default; do not add target-cpu or
# float-reassociation flags, they would break native/WASM determinism.
