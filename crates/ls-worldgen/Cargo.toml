[package]
name = "ls-worldgen"
description = "Seeded SDF world generation, share codes, chunk store, meshers, terrain edits and paint layer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ls-math.workspace = true
serde.workspace = true
thiserror.workspace = true
# Golden hashes are part of the public API so the WASM build can report the
# same hashes as native code (determinism cross-check).
sha2.workspace = true

[dev-dependencies]
ron.workspace = true

# Lets the same unit tests run on wasm32 under Node:
#   CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
#   cargo test -p ls-worldgen --target wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
